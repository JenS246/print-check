<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#d6ab45" />
    <meta name="description" content="The coins and bills currently available in Print Check." />
    <title>Coins and bills | Print Check</title>
    <link rel="stylesheet" href="styles.css?v=23" />
  </head>
  <body class="collection-page">
    <div class="page-decorations" aria-hidden="true">
      <img class="decoration decoration-envelope" src="assets/art/coin-envelope.svg" alt="" />
      <img class="decoration decoration-coins-loose" src="assets/art/loose-coins.svg" alt="" />
      <img class="decoration decoration-folded-bill" src="assets/art/folded-bill.svg" alt="" />
      <img class="decoration decoration-stack" src="assets/art/coin-stack.svg" alt="" />
    </div>
    <div class="page-shell">
      <header class="site-header">
        <a class="site-name" href="index.html">
          <span class="title-line">
            <span class="title-words"><span class="title-print">Print</span> <span class="title-check"><span class="title-check-ghost" aria-hidden="true">Check</span><span class="title-check-front">Check</span></span></span>
            <img class="title-coin" src="assets/art/title-coin.svg" alt="" aria-hidden="true" />
          </span>
          <svg class="title-underline" viewBox="0 0 150 9" aria-hidden="true" preserveAspectRatio="none">
            <path d="M3 5.3 C27 3.6 51 6.1 75 4.7 C99 3.5 124 5.7 147 4.2" />
          </svg>
        </a>
        <nav aria-label="Primary navigation">
          <a href="notes.html" aria-current="page">Collection</a>
          <a href="index.html#how-to-play">How to play</a>
        </nav>
      </header>

      <main class="collection-main">
        <header class="collection-intro">
          <h1>Coins and bills</h1>
          <a class="collection-play-link" href="index.html">Play</a>
        </header>

        <div id="collection-status" class="collection-status" role="status">
          <p id="collection-status-message">Loading collection...</p>
          <button id="collection-retry" class="secondary-button sketch-button" type="button" hidden>Retry</button>
        </div>

        <div id="collection-gallery" class="collection-gallery" hidden></div>

        <section id="collection-detail" class="collection-detail" hidden aria-live="polite">
          <a class="all-items-link" href="notes.html">All coins and bills</a>
          <div id="collection-list" class="collection-list"></div>
          <div class="collection-actions" aria-label="Collection controls">
            <button id="previous-item" class="secondary-button sketch-button" type="button">Previous</button>
            <button id="next-item" class="primary-button sketch-button" type="button">Next</button>
          </div>
        </section>
      </main>
    </div>
    <script type="module">
      const status = document.querySelector('#collection-status');
      const message = document.querySelector('#collection-status-message');
      const retry = document.querySelector('#collection-retry');
      const gallery = document.querySelector('#collection-gallery');

      retry.addEventListener('click', () => window.location.reload());

      import('./src/collection.js?v=23')
        .then(() => { status.hidden = true; })
        .catch(() => {
          gallery.hidden = true;
          message.textContent = 'The collection did not load.';
          retry.hidden = false;
        });
    </script>
  </body>
</html>
