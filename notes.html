<!doctype html>

  <body class="collection-page">

      <img class="decoration decoration-coins" src="assets/art/overlapping-coins.svg" alt="" />
      <img class="decoration decoration-roll" src="assets/art/rolled-bill.svg" alt="" />
      <img class="decoration decoration-fan" src="assets/art/bill-fan.svg" alt="" />

    <div class="page-shell">
